name: Verify

on:
  pull_request:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run verify (typecheck + e2e contract)
        env:
          # Scoped to this repo's Supabase project — lets the storage e2e test
          # exercise real upload/scrub/delete instead of skipping.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: npm run verify

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore

  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      # Lighthouse must measure a real production server: `next start` serving
      # the build above (dev mode would inflate JS cost and distort scores).
      # No Supabase env needed — the budget gate only loads public pages.
      - name: Start production server
        run: |
          DATA_DIR=.lh-data npx next start -p 3457 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3457/ > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:3457/ > /dev/null

      - name: Lighthouse budget check
        run: PORT=3457 node scripts/lh-budget.cjs

      - name: Upload Lighthouse reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lh-report-*.json
          if-no-files-found: ignore
