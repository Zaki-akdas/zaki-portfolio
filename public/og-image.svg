<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050510"/>
      <stop offset="50%" style="stop-color:#0a0a1a"/>
      <stop offset="100%" style="stop-color:#10102a"/>
    </linearGradient>
    <linearGradient id="text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e8e0ff"/>
      <stop offset="40%" style="stop-color:#a78bfa"/>
      <stop offset="70%" style="stop-color:#6c3ce0"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <radialGradient id="nebula1" cx="80%" cy="20%" r="40%">
      <stop offset="0%" style="stop-color:#6c3ce0;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#6c3ce0;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="nebula2" cx="20%" cy="80%" r="35%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="planet" cx="45%" cy="45%" r="50%">
      <stop offset="0%" style="stop-color:#2a4a8a"/>
      <stop offset="60%" style="stop-color:#1a3a6e"/>
      <stop offset="100%" style="stop-color:#0a1a3a"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Nebula blobs -->
  <ellipse cx="960" cy="126" rx="400" ry="250" fill="url(#nebula1)"/>
  <ellipse cx="240" cy="504" rx="350" ry="200" fill="url(#nebula2)"/>

  <!-- Stars -->
  <circle cx="100" cy="80" r="1.5" fill="#e8e0ff" opacity="0.6"/>
  <circle cx="250" cy="150" r="1" fill="#e8e0ff" opacity="0.4"/>
  <circle cx="400" cy="60" r="1.2" fill="#e8e0ff" opacity="0.5"/>
  <circle cx="550" cy="120" r="0.8" fill="#e8e0ff" opacity="0.3"/>
  <circle cx="700" cy="80" r="1.5" fill="#e8e0ff" opacity="0.6"/>
  <circle cx="850" cy="200" r="1" fill="#e8e0ff" opacity="0.4"/>
  <circle cx="1000" cy="100" r="1.3" fill="#e8e0ff" opacity="0.5"/>
  <circle cx="1100" cy="180" r="0.8" fill="#e8e0ff" opacity="0.3"/>
  <circle cx="150" cy="300" r="1" fill="#e8e0ff" opacity="0.4"/>
  <circle cx="350" cy="280" r="1.2" fill="#a78bfa" opacity="0.5"/>
  <circle cx="600" cy="350" r="0.8" fill="#e8e0ff" opacity="0.3"/>
  <circle cx="900" cy="400" r="1.5" fill="#e8e0ff" opacity="0.5"/>
  <circle cx="1050" cy="350" r="1" fill="#a78bfa" opacity="0.4"/>
  <circle cx="200" cy="450" r="1.2" fill="#e8e0ff" opacity="0.5"/>
  <circle cx="500" cy="500" r="0.8" fill="#e8e0ff" opacity="0.3"/>
  <circle cx="750" cy="480" r="1" fill="#e8e0ff" opacity="0.4"/>
  <circle cx="1150" cy="500" r="1.5" fill="#e8e0ff" opacity="0.6"/>
  <circle cx="300" cy="550" r="1" fill="#e8e0ff" opacity="0.4"/>
  <circle cx="650" cy="580" r="0.8" fill="#a78bfa" opacity="0.5"/>

  <!-- Planet -->
  <circle cx="880" cy="280" r="100" fill="url(#planet)" filter="url(#glow)"/>
  <circle cx="880" cy="280" r="108" fill="none" stroke="#6c3ce0" stroke-width="0.5" opacity="0.4"/>
  <circle cx="880" cy="280" r="118" fill="none" stroke="#3b82f6" stroke-width="0.3" opacity="0.25"/>
  <!-- Planet ring -->
  <ellipse cx="880" cy="280" rx="140" ry="20" fill="none" stroke="#a78bfa" stroke-width="1.5" opacity="0.35" transform="rotate(-15, 880, 280)"/>

  <!-- Text -->
  <text x="80" y="250" font-family="Inter, system-ui, sans-serif" font-weight="900" font-size="72" fill="url(#text)" letter-spacing="-2">Zaki Akdas</text>
  <text x="80" y="330" font-family="Inter, system-ui, sans-serif" font-weight="900" font-size="72" fill="url(#text)" letter-spacing="-2">Choudhary</text>

  <text x="80" y="390" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="28" fill="#a78bfa" letter-spacing="6" text-transform="uppercase">WEB DEVELOPER</text>

  <text x="80" y="440" font-family="Inter, system-ui, sans-serif" font-weight="400" font-size="20" fill="#6b6880">Professional modern websites and digital experiences</text>
  <text x="80" y="470" font-family="Inter, system-ui, sans-serif" font-weight="400" font-size="20" fill="#6b6880">for businesses of every kind.</text>

  <!-- Bottom bar -->
  <rect x="80" y="520" width="120" height="2" fill="#6c3ce0" rx="1"/>
  <text x="80" y="560" font-family="monospace" font-weight="700" font-size="16" fill="#4a4760" letter-spacing="2">zakiakdas.vercel.app</text>
</svg>
