<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ============================================================ helpers */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const easeInExpo=t=>t<=0?0:Math.pow(2,10*(t-1));
const easeOutExpo=t=>t>=1?1:1-Math.pow(2,-10*t);
const easeOutCubic=t=>1-Math.pow(1-t,3);
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const rand=(a,b)=>a+Math.random()*(b-a);
const $=s=>document.querySelector(s);

/* ============================================================ renderer */
const canvas=$('#gl');
const renderer=new THREE.WebGLRenderer({canvas, antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));
renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=0.85;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x000004);
scene.fog=new THREE.Fog(0x000004,3000,9000);

const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,12000);
camera.position.set(0,0,0);

/* ============================================================ procedural textures */
function radialTex(size,stops){ // stops: [ [pos, rgba], ... ]
  const c=document.createElement('canvas');c.width=c.height=size;
  const x=c.getContext('2d');
  const g=x.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
  stops.forEach(s=>g.addColorStop(s[0],s[1]));
  x.fillStyle=g;x.fillRect(0,0,size,size);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
}
const starTex=radialTex(64,[[0,'rgba(255,255,255,1)'],[0.25,'rgba(225,238,255,0.9)'],[0.55,'rgba(150,190,255,0.28)'],[1,'rgba(120,160,255,0)']]);
const dustTex=radialTex(32,[[0,'rgba(255,255,255,0.9)'],[0.5,'rgba(200,220,255,0.3)'],[1,'rgba(200,220,255,0)']]);

function nebulaTex(c1,c2){
  const s=256,c=document.createElement('canvas');c.width=c.height=s;const x=c.getContext('2d');
  x.globalCompositeOperation='lighter';
  for(let i=0;i<7;i++){
    const px=rand(s*.25,s*.75),py=rand(s*.25,s*.75),r=rand(s*.18,s*.45);
    const col=i%2?c1:c2;
    const g=x.createRadialGradient(px,py,0,px,py,r);
    g.addColorStop(0,col+'');g.addColorStop(1,'rgba(0,0,0,0)');
    x.globalAlpha=rand(.35,.75);x.fillStyle=g;
    x.beginPath();x.arc(px,py,r,0,Math.PI*2);x.fill();
  }
  x.globalCompositeOperation='destination-in';x.globalAlpha=1;
  const m=x.createRadialGradient(s/2,s/2,s*.1,s/2,s/2,s*.52);
  m.addColorStop(0,'rgba(0,0,0,1)');m.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=m;x.fillRect(0,0,s,s);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
}
const nebTexs=[
  nebulaTex('rgba(46,84,214,1)','rgba(13,22,74,1)'),
  nebulaTex('rgba(108,58,214,1)','rgba(38,14,92,1)'),
  nebulaTex('rgba(186,42,116,1)','rgba(66,9,52,1)'),
  nebulaTex('rgba(28,146,176,1)','rgba(7,42,66,1)'),
  nebulaTex('rgba(198,106,42,1)','rgba(74,33,7,1)'),
  nebulaTex('rgba(136,92,226,1)','rgba(33,11,78,1)')
];

function ringTex(){
  const s=256,c=document.createElement('canvas');c.width=c.height=s;const x=c.getContext('2d');
  x.strokeStyle='rgba(170,215,255,0.95)';x.lineWidth=5;
  x.shadowColor='rgba(120,180,255,0.9)';x.shadowBlur=22;
  x.beginPath();x.arc(s/2,s/2,s/2-26,0,Math.PI*2);x.stroke();
  x.lineWidth=1.5;x.shadowBlur=8;x.beginPath();x.arc(s/2,s/2,s/2-34,0,Math.PI*2);x.stroke();
  return new THREE.CanvasTexture(c);
}

function planetTexture(){
  const w=1024,h=512,base=document.createElement('canvas');base.width=w;base.height=h;const b=base.getContext('2d');
  const g=b.createLinearGradient(0,0,0,h);
  g.addColorStop(0,'#020b1c');g.addColorStop(.32,'#072a50');g.addColorStop(.5,'#0a3d68');g.addColorStop(.68,'#072a50');g.addColorStop(1,'#020a18');
  b.fillStyle=g;b.fillRect(0,0,w,h);
  const cols=['#0e4a7a','#125e94','#0a3b66','#1a7ab5','#093357'];
  for(let i=0;i<90;i++){
    b.fillStyle=cols[i%cols.length];b.globalAlpha=0.05+Math.random()*0.08;
    b.fillRect(0,Math.random()*h,w,6+Math.random()*30);
  }
  b.globalAlpha=1;
  const s=document.createElement('canvas');s.width=256;s.height=128;const x=s.getContext('2d');
  for(let i=0;i<700;i++){
    const r=Math.random(),lat=Math.pow(Math.random(),.72)*128;
    x.fillStyle=r<.72?'rgba(190,225,250,'+(0.05+Math.random()*0.1)+')':(r<.9?'rgba(120,190,235,'+(0.04+Math.random()*0.08)+')':'rgba(70,140,200,'+(0.05+Math.random()*0.07)+')');
    x.beginPath();x.ellipse(Math.random()*256,lat+(Math.random()-.5)*8,rand(4,30),rand(1,5),0,0,Math.PI*2);x.fill();
  }
  b.filter='blur(5px)';b.drawImage(s,0,0,w,h);
  b.filter='blur(2px)';b.globalAlpha=.55;b.drawImage(s,-w*.13,0,w,h);b.drawImage(s,w*.87,0,w,h);
  b.filter='none';b.globalAlpha=1;
  for(let i=0;i<5;i++){
    const cx=Math.random()*w,cy=60+Math.random()*390,rr=40+Math.random()*40;
    const rg=b.createRadialGradient(cx,cy,2,cx,cy,rr);
    rg.addColorStop(0,'rgba(225,240,255,0.5)');rg.addColorStop(.4,'rgba(150,205,240,0.22)');rg.addColorStop(1,'rgba(150,205,240,0)');
    b.save();b.translate(cx,cy);b.scale(1.9,.8);b.translate(-cx,-cy);
    b.fillStyle=rg;b.beginPath();b.arc(cx,cy,rr,0,Math.PI*2);b.fill();b.restore();
  }
  const pg=b.createLinearGradient(0,0,0,h);
  pg.addColorStop(0,'rgba(1,4,12,0.85)');pg.addColorStop(.18,'rgba(1,4,12,0)');pg.addColorStop(.82,'rgba(1,4,12,0)');pg.addColorStop(1,'rgba(0,3,10,0.9)');
  b.fillStyle=pg;b.fillRect(0,0,w,h);
  const t=new THREE.CanvasTexture(base);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=4;return t;
}
function cloudTexture(){
  const w=512,h=256,c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
  for(let i=0;i<420;i++){
    const r=Math.random();
    x.fillStyle='rgba('+(r<.6?'235,246,255':'180,215,245')+','+(0.06+Math.random()*.14)+')';
    x.beginPath();x.ellipse(Math.random()*w,Math.pow(Math.random(),.8)*h,rand(6,34),rand(1.5,6),0,0,Math.PI*2);x.fill();
  }
  const c2=document.createElement('canvas');c2.width=w;c2.height=h;const y=c2.getContext('2d');
  y.filter='blur(3px)';y.drawImage(c,0,0);y.filter='blur(1px)';y.globalAlpha=.7;y.drawImage(c,-w*.11,0);y.drawImage(c,w*.89,0);
  const t=new THREE.CanvasTexture(c2);t.colorSpace=THREE.SRGBColorSpace;return t;
}

/* ============================================================ audio (synthesized score) */
const Audio2={ ctx:null, on:true,
  init(){ if(this.ctx) return;
    try{
      const C=window.AudioContext||window.webkitAudioContext; this.ctx=new C();
      this.master=this.ctx.createGain(); this.master.gain.value=.85;
      const comp=this.ctx.createDynamicsCompressor();
      this.master.connect(comp); comp.connect(this.ctx.destination);
      // generated hall impulse
      const len=this.ctx.sampleRate*2.6, ir=this.ctx.createBuffer(2,len,this.ctx.sampleRate);
      for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<len;i++){d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6);}}
      this.verb=this.ctx.createConvolver();this.verb.buffer=ir;
      this.wet=this.ctx.createGain();this.wet.gain.value=.4;this.verb.connect(this.wet);this.wet.connect(this.master);
      this.noise=this.ctx.createBuffer(1,this.ctx.sampleRate*2,this.ctx.sampleRate);
      const nd=this.noise.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
      this.drone();
    }catch(e){}
  },
  drone(){ if(!this.ctx)return; const t=this.ctx.currentTime;
    const g=this.ctx.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.10,t+2.5);
    const lp=this.ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=130;lp.Q.value=.6;
    [55,55.6,110.3].forEach((f,i)=>{const o=this.ctx.createOscillator();o.type=i<2?'sawtooth':'sine';o.frequency.value=f;
      const og=this.ctx.createGain();og.gain.value=i<2?.5:.35;o.connect(og);og.connect(lp);o.start();});
    const lfo=this.ctx.createOscillator();lfo.frequency.value=.08;
    const lg=this.ctx.createGain();lg.gain.value=45;lfo.connect(lg);lg.connect(lp.frequency);lfo.start();
    lp.connect(g);g.connect(this.master);
    const send=this.ctx.createGain();send.gain.value=.25;lp.connect(send);send.connect(this.verb);
  },
  riser(dur=7.4){ if(!this.ctx)return; this.stopRiser(); const t=this.ctx.currentTime;
    const src=this.ctx.createBufferSource();src.buffer=this.noise;src.loop=true;
    const bp=this.ctx.createBiquadFilter();bp.type='bandpass';bp.Q.value=1.1;
    bp.frequency.setValueAtTime(180,t);bp.frequency.exponentialRampToValueAtTime(4200,t+dur);
    const g=this.ctx.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.42,t+dur*.92);g.gain.exponentialRampToValueAtTime(.0001,t+dur+.6);
    const sub=this.ctx.createOscillator();sub.type='sine';sub.frequency.setValueAtTime(34,t);sub.frequency.exponentialRampToValueAtTime(82,t+dur);
    const sg=this.ctx.createGain();sg.gain.setValueAtTime(.0001,t);sg.gain.exponentialRampToValueAtTime(.22,t+dur);sg.gain.exponentialRampToValueAtTime(.0001,t+dur+.4);
    src.connect(bp);bp.connect(g);g.connect(this.master);const s2=this.ctx.createGain();s2.gain.value=.3;g.connect(s2);s2.connect(this.verb);
    sub.connect(sg);sg.connect(this.master);
    src.start(t);sub.start(t);src.stop(t+dur+1);sub.stop(t+dur+1);
    this._riserNodes=[src,sub];
  },
  stopRiser(){ (this._riserNodes||[]).forEach(n=>{try{n.stop()}catch(e){}}); this._riserNodes=[]; },
  whoosh(){ if(!this.ctx||!this.on)return; const t=this.ctx.currentTime,d=rand(.5,.9);
    const src=this.ctx.createBufferSource();src.buffer=this.noise;src.loop=true;
    const bp=this.ctx.createBiquadFilter();bp.type='bandpass';bp.Q.value=2.4;

/* ============================================================ deep universe : galaxies, milky band, cluster, hero stars, meteors */
const galaxies=[];
function makeGalaxyGeo(cfg){
  const count=cfg.count, R=cfg.radius, core=Math.floor(count*.14), total=count+core;
  const pos=new Float32Array(total*3), col=new Float32Array(total*3);
  const cIn=new THREE.Color(cfg.in), cOut=new THREE.Color(cfg.out), tmp=new THREE.Color();
  for(let i=0;i<count;i++){
    const r=Math.pow(Math.random(),.62)*R;
    const branch=((i%cfg.branches)/cfg.branches)*Math.PI*2;
    const a=branch+cfg.spin*(r/R)*2.6;
    const sc=cfg.scatter*r;
    const rx=Math.pow(Math.random(),3)*(Math.random()<.5?-1:1)*sc;
    const rz=Math.pow(Math.random(),3)*(Math.random()<.5?-1:1)*sc;
    const ry=Math.pow(Math.random(),3)*(Math.random()<.5?-1:1)*sc*.3;
    pos[i*3]=Math.cos(a)*r+rx; pos[i*3+1]=ry; pos[i*3+2]=Math.sin(a)*r+rz;
    tmp.copy(cIn).lerp(cOut,r/R);
    const dim=.5+.5*Math.random();
    col[i*3]=tmp.r*dim; col[i*3+1]=tmp.g*dim; col[i*3+2]=tmp.b*dim;
  }
  for(let i=count;i<total;i++){ /* dense hot galactic core */
    const r=Math.pow(Math.random(),2.4)*R*.13;
    const th=Math.random()*Math.PI*2, ph=Math.acos(rand(-1,1));
    pos[i*3]=r*Math.sin(ph)*Math.cos(th); pos[i*3+1]=r*Math.cos(ph)*.6; pos[i*3+2]=r*Math.sin(ph)*Math.sin(th);
    const dim=.9+.3*Math.random();
    col[i*3]=Math.min(cIn.r*1.1*dim,1); col[i*3+1]=Math.min(cIn.g*1.05*dim,1); col[i*3+2]=Math.min(cIn.b*dim,1);
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setAttribute('color',new THREE.BufferAttribute(col,3));
  return geo;
}
function addGalaxy(cfg,x,y,z,rx,ry,scale,spin){
  const mat=new THREE.PointsMaterial({size:1.8,map:starTex,vertexColors:true,transparent:true,opacity:.8,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:false});
  mat.fog=false;
  const pts=new THREE.Points(makeGalaxyGeo(cfg),mat);
  pts.position.set(x,y,z); pts.rotation.set(rx,ry,0); pts.scale.setScalar(scale);
  pts.userData.spin=spin; scene.add(pts); galaxies.push(pts); return pts;
}

/* ---------- milky way bands across the sky ---------- */
function makeBand(nv,count,op,px,glowOp,segs){
  const n=nv.clone().normalize();
  const u=new THREE.Vector3().crossVectors(n,new THREE.Vector3(0,0,1)).normalize();
  const w=new THREE.Vector3().crossVectors(n,u);
  const pos=new Float32Array(count*3), col=new Float32Array(count*3);
  for(let i=0;i<count;i++){
    const th=Math.random()*Math.PI*2, r=rand(3800,4700);
    const g=(Math.random()+Math.random()+Math.random()-1.5)/1.5;
    pos[i*3]=(u.x*Math.cos(th)+w.x*Math.sin(th))*r+n.x*g*300;
    pos[i*3+1]=(u.y*Math.cos(th)+w.y*Math.sin(th))*r+n.y*g*300;
    pos[i*3+2]=(u.z*Math.cos(th)+w.z*Math.sin(th))*r+n.z*g*300;
    const c=Math.random()<.8?[.7,.8,1]:[1,.9,.75], d=rand(.12,.45);
    col[i*3]=c[0]*d;col[i*3+1]=c[1]*d;col[i*3+2]=c[2]*d;
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setAttribute('color',new THREE.BufferAttribute(col,3));
  const mat=new THREE.PointsMaterial({size:px,map:starTex,vertexColors:true,transparent:true,opacity:op,depthWrite:false,blending:THREE.AdditiveBlending,sizeAttenuation:false});
  mat.fog=false; scene.add(new THREE.Points(geo,mat));
  for(let i=0;i<segs;i++){
    const th=i/segs*Math.PI*2+.6;
    const m=new THREE.SpriteMaterial({map:nebTexs[i%nebTexs.length],transparent:true,opacity:glowOp,blending:THREE.AdditiveBlending,depthWrite:false});
    m.fog=false; m.rotation=-.55;
    const sp=new THREE.Sprite(m);
    sp.position.set((u.x*Math.cos(th)+w.x*Math.sin(th))*4300,(u.y*Math.cos(th)+w.y*Math.sin(th))*4300,(u.z*Math.cos(th)+w.z*Math.sin(th))*4300);
    sp.scale.set(3400,1200,1); scene.add(sp);
  }
}

/* ============================================================ sequence state machine */
const SEQ={IGNITION:.5,LIGHT:2.4,DECEL:3.6,SETTLE:5.6,FLARE:5.3,BOOM:5.7,TITLE:5.9,SHIM:6.35};
let mode='preview', seqT=0, flashV=0, shakeKick=0;
const F={}; // one-shot flags

function computeState(t){
  let s={speed:6,warp:0,fov:62,shake:0,bloom:.6,ca:0,roll:0,dolly:0,planetIn:0,flare:0};
  if(t<SEQ.IGNITION){ s.speed=6; }
  else if(t<SEQ.LIGHT){
    const u=(t-SEQ.IGNITION)/(SEQ.LIGHT-SEQ.IGNITION),p=easeInExpo(u);
    s.speed=lerp(6,1400,p);
    s.warp=sstep(0,.55,u); s.fov=lerp(62,98,sstep(0,1,u));
    s.shake=sstep(.25,1,u); s.bloom=lerp(.6,1.35,sstep(0,1,u)); s.ca=sstep(.35,1,u);
  } else if(t<SEQ.DECEL){
    s.speed=1400+Math.sin(t*7)*90; s.warp=1; s.fov=98+Math.sin(t*3.1)*1.5;
    s.shake=.55; s.bloom=1.35; s.ca=1; s.roll=Math.sin(t*.9)*.05;
  } else if(t<SEQ.SETTLE+.6){
    const u=clamp((t-SEQ.DECEL)/2.0,0,1),p=easeOutExpo(u);
    s.speed=lerp(1400,14,p); s.warp=1-sstep(0,.8,u); s.fov=lerp(98,52,sstep(.1,1,u));
    s.shake=(1-p)*.42; s.bloom=lerp(1.35,.78,u); s.ca=1-sstep(0,.7,u);
    s.roll=Math.sin(t*.9)*.05*(1-u);
  } else {
    s.speed=14; s.fov=52; s.shake=.02; s.bloom=.78+s.flare*.18;
    s.dolly=-Math.min((t-SEQ.SETTLE)*14,150);
  }
  s.planetIn=sstep(3.9,5.3,t);
  s.flare=sstep(SEQ.FLARE,6.4,t);
  if(s.flare>0) s.flare=Math.min(s.flare,1)+(Math.sin(t*1.7)*.04+.04)*s.flare;
  return s;
}

  titleTl

      {opacity:1,scale:1,filter:'blur(0px)',duration:1.8,ease:'power4.out'},0)
    .fromTo(titleWrapEl,{scale:1.12},{scale:1,duration:3.0,ease:'power3.out'},0)
    .fromTo('#replayBtn',{opacity:0,y:12},{opacity:1,y:0,duration:.9,ease:'power2.out',
      onStart:()=>{$('#replayBtn').style.pointerEvents='auto';}},1.8)
    .add(()=>titleWrapEl.classList.add('lit'),1.0);
}
function resetTitle(){
  if(titleTl){titleTl.kill();titleTl=null;}
  titleWrapEl.classList.remove('lit');
  gsap.set('#zaBig',{opacity:0,scale:1.4,filter:'blur(26px)'});
  gsap.set(titleWrapEl,{scale:1});
  gsap.set('#replayBtn',{opacity:0,y:12});
  $('#replayBtn').style.pointerEvents='none';
}

/* ---------- sequence one-shot events (sound + reveal only) ---------- */
function fireEvents(t){
  const once=(k,fn)=>{ if(!F[k]){F[k]=true;fn();} };
  if(t>=SEQ.IGNITION) once('r',()=>Audio2.riser(3.1));
  if(t>=SEQ.DECEL) once('d',()=>Audio2.stopRiser());
  if(t>=4.9) once('nova',()=>triggerNova());
  if(t>=SEQ.BOOM) once('b',()=>{ Audio2.boom(); flashV=.5; shakeKick=1; });
  if(t>=SEQ.TITLE) once('t',()=>revealTitle());
  if(t>=SEQ.SHIM) once('s',()=>Audio2.shimmer());
}

/* ============================================================ flow control */
const startOverlay=$('#start'),fadeEl=$('#fade'),flashEl=$('#flash'),hudEl=$('#hud'),grainEl=$('#grain');

/* grain tile */
(function(){const c=document.createElement('canvas');c.width=c.height=140;const x=c.getContext('2d');
const id=x.createImageData(140,140);for(let i=0;i<id.data.length;i+=4){const v=Math.random()*255|0;
id.data[i]=v;id.data[i+1]=v;id.data[i+2]=v;id.data[i+3]=26;}x.putImageData(id,0,0);
grainEl.style.backgroundImage=`url(${c.toDataURL()})`;})();

function beginSequence(){
  if(mode==='play')return;
  Audio2.init(); Audio2.setOn(Audio2.on);
  gsap.to(startOverlay,{opacity:0,duration:.8,ease:'power2.inOut',onComplete:()=>startOverlay.style.display='none'});
  document.body.classList.add('bars');
  gsap.to(hudEl,{opacity:1,duration:1.6,delay:.6});
  Object.keys(F).forEach(k=>delete F[k]);
  seqT=-0.4; mode='play';
  gsap.fromTo(fadeEl,{opacity:1},{opacity:0,duration:1.1,ease:'power2.out',delay:.1});
}
function replay(){
  Object.keys(F).forEach(k=>delete F[k]);
  resetTitle(); resetNova(); Audio2.stopRiser();
  flashV=0;shakeKick=0; ringTimer=0;
  rings.forEach(r=>{r.active=false;r.sp.visible=false;r.sp.material.opacity=0;});
  gsap.fromTo(fadeEl,{opacity:1},{opacity:0,duration:1.0,ease:'power2.out'});
  seqT=-0.35; mode='play';
}
$('#startBtn').addEventListener('click',beginSequence);
$('#replayBtn').addEventListener('click',replay);
addEventListener('keydown',e=>{ if(e.code==='Enter'&&mode==='preview') beginSequence(); else if(e.code==='KeyR'&&mode==='play'&&seqT>6.5) replay(); });
$('#soundBtn').addEventListener('click',()=>{
  Audio2.on=!Audio2.on; Audio2.setOn(Audio2.on);
  $('#icoVolOn').classList.toggle('hidden',!Audio2.on);
  $('#icoVolOff').classList.toggle('hidden',Audio2.on);
});

/* mouse parallax */
let mx=0,my=0,tmx=0,tmy=0;
addEventListener('mousemove',e=>{tmx=(e.clientX/innerWidth-.5)*2;tmy=(e.clientY/innerHeight-.5)*2;});

/* resize */
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);
});

/* ============================================================ main loop */
const clock=new THREE.Clock();
let phaseTxt='', whooshT=0, readyShown=false;

function loop(){
  const dt=Math.min(clock.getDelta(),.05), time=clock.elapsedTime;
  if(mode==='play') seqT+=dt;
  const t=mode==='play'?seqT:-1;
  const S=mode==='play'?computeState(Math.max(t,0)):previewState;
  if(mode==='play'&&t>=0) fireEvents(t);

  mx=lerp(mx,tmx,dt*3); my=lerp(my,tmy,dt*3);

  /* --- stars --- */
  const sp=S.speed;
  for(let i=0;i<N;i++){
    let z=sPos[i*3+2]+sp*dt;
    if(z>60){z-=DEPTH;const r=Math.pow(Math.random(),.72)*620+14,a=Math.random()*Math.PI*2;
      sPos[i*3]=Math.cos(a)*r;sPos[i*3+1]=Math.sin(a)*r*.72;}
    sPos[i*3+2]=z;
    const tail=clamp(sp*.16,0,300)*(0.6+S.warp*0.7);
    const j=i*6;
    lPos[j]=sPos[i*3];lPos[j+1]=sPos[i*3+1];lPos[j+2]=z;
    lPos[j+3]=sPos[i*3];lPos[j+4]=sPos[i*3+1];lPos[j+5]=z-tail;
  }
  ptsGeo.attributes.position.needsUpdate=true;
  lineGeo.attributes.position.needsUpdate=true;
  starPts.material.opacity=(1-S.warp*.85)*.95;
  starPts.material.size=1.7+Math.sin(time*2.2)*.15;
  starLines.material.opacity=S.warp*.7;

  /* --- nebulas --- */
  const nebGate=1-S.planetIn*.9;
  for(const nb of nebulas){
    let z=nb.position.z+sp*dt;
    if(z>220){z-=DEPTH;const a=Math.random()*Math.PI*2,r=260+Math.pow(Math.random(),1.4)*950;
      nb.position.x=Math.cos(a)*r;nb.position.y=Math.sin(a)*r*.7;}
    nb.position.z=z;
    nb.material.rotation+=nb.userData.rw*dt;
    // fade out as a nebula reaches the camera: far when calm, allowed to whip past during warp
    const nearLimit=lerp(-30,150,S.warp);
    const nearFade=1-sstep(-380,nearLimit,z);
    nb.material.opacity=clamp(nearFade*.10*nebGate,0,.13);
  }

  /* --- warp rings (cruise only) --- */
  const cruise=mode==='play'&&t>SEQ.LIGHT&&t<SEQ.DECEL-.3;
  if(cruise){ ringTimer-=dt;
    if(ringTimer<=0){ ringTimer=.2;
      const r=rings.find(r=>!r.active);
      if(r){r.active=true;r.z=-1500;r.ox=rand(-90,90);r.oy=rand(-60,60);r.s0=rand(120,220);r.sp.visible=true;}
    }
  }
  for(const r of rings){ if(!r.active)continue;
    r.z+=sp*dt;
    const k=(r.z+1500)/1500;
    const s=r.s0+k*1500; r.sp.scale.set(s,s,1);
    r.sp.position.set(r.ox*(1-k),r.oy*(1-k),r.z);
    r.sp.material.opacity=Math.sin(clamp(k,0,1)*Math.PI)*.5;
    if(r.z>80){r.active=false;r.sp.visible=false;}
  }

  /* --- planet --- */
  const pz=lerp(zFar,zNear,easeOutCubic(sstep(3.35,5.5,Math.max(t,0))));
  planetGroup.position.set(planetX,planetY+(mode==='play'?Math.sin(Math.max(t,0)*.3)*6:0),pz);
  planet.rotation.y=time*.02; clouds.rotation.y=time*.026;
  planetMat.opacity=S.planetIn; cloudMat.opacity=S.planetIn*.5;
  moonMat.opacity=S.planetIn*.95; moon.rotation.y=time*.03; moon.position.x=-1150+Math.sin(time*.05)*30;
  atmoMat.uniforms.uO.value=S.planetIn;
  sun.intensity=S.flare*3.4;

  /* --- flare --- */
  const f=Math.max(S.flare,0.0001);
  flareGroup.scale.setScalar(f*(1+shakeKick*.15));
  flareGroup.rotation.z=Math.sin(time*.4)*.03;
  flareRing.material.opacity=.16*f*(1+Math.sin(time*1.3)*.2);

  /* --- dust motes at reveal --- */
  dust.material.opacity=sstep(5.7,7.0,Math.max(t,0))*.25;
  dust.rotation.z=time*.008; dust.position.y=Math.sin(time*.25)*1.5;

  /* --- deep universe motion : galaxies, cluster, hero twinkle, meteors --- */
  for(const g of galaxies) g.rotation.y+=g.userData.spin*dt;
  globCluster.rotation.y+=dt*.012;
  farPlanets.forEach((p,i)=>{ p.position.y=p.userData.y0+Math.sin(time*.07+i*1.9)*22; });
  bgStars.material.opacity=.85+Math.sin(time*1.3)*.08;
  for(const h of heroes){
    const tw=h.base*(.72+.28*Math.sin(time*h.speed+h.phase));
    h.core.material.opacity=tw; h.spike.material.opacity=tw*.5;
    h.spike.material.rotation+=dt*.04*h.dir;
  }
  if(S.warp<.45){ meteorTimer-=dt; if(meteorTimer<=0){spawnMeteor();meteorTimer=rand(1.6,4.4);} }
  for(const m of meteors){ if(!m.active)continue;
    m.t+=dt; const k=m.t/m.dur;
    if(k>=1){ m.active=false; m.head.material.opacity=0; m.line.material.opacity=0; continue; }
    const hx=m.from.x+m.dir.x*m.speed*m.t, hy=m.from.y+m.dir.y*m.speed*m.t, hz=m.from.z+m.dir.z*m.speed*m.t;
    const tl=m.speed*.07;
    const lp=m.line.geometry.attributes.position;
    lp.setXYZ(0,hx,hy,hz); lp.setXYZ(1,hx-m.dir.x*tl,hy-m.dir.y*tl,hz-m.dir.z*tl); lp.needsUpdate=true;
    const o=Math.sin(k*Math.PI);
    m.head.material.opacity=o*.95; m.line.material.opacity=o*.5;
    m.head.position.set(hx,hy,hz);
  }

  /* --- black holes spin --- */
  blackHoles.forEach(b=>{ b.material.rotation+=dt*b.userData.spin; });

  /* --- the doomed world & the big bang --- */
  if(!novaDone){
    const dv=(mode==='play')?sstep(4.0,4.7,Math.max(t,0)):0;
    doomed.material.opacity=dv; doomed.visible=dv>.001;
  }
  if(novaActive){
    dLife+=dt;
    const k=Math.min(dLife/3.4,1), damp=Math.max(0,1-.45*dt);
    for(let i=0;i<DB;i++){
      dbPos[i*3]+=dbVel[i*3]*dt; dbPos[i*3+1]+=dbVel[i*3+1]*dt; dbPos[i*3+2]+=dbVel[i*3+2]*dt;
      dbVel[i*3]*=damp; dbVel[i*3+1]*=damp; dbVel[i*3+2]*=damp;
    }
    debrisGeo.attributes.position.needsUpdate=true;
    debrisMat.opacity=.95*Math.pow(1-k,1.5);
    novaGlow.scale.setScalar(40+easeOutCubic(Math.min(dLife*2.2,1))*2500);
    novaGlow.material.opacity=Math.pow(.01,dLife*.5);
    ember.scale.set(700+dLife*260,700+dLife*260,1);
    ember.material.opacity=Math.max(.05,.32*Math.pow(.3,dLife));
    ember.material.rotation+=dt*.02;
    for(const rg of novaRings){
      if(!rg.active)continue; rg.t+=dt; if(rg.t<0)continue;
      const kk=rg.t/2.0;
      if(kk>=1){rg.active=false; rg.sp.visible=false; continue;}
      rg.sp.visible=true;
      const sc=70+Math.pow(kk,1.7)*2900; rg.sp.scale.set(sc,sc,1);
      rg.sp.material.opacity=.9*(1-kk);
    }
    if(dLife>4) novaActive=false;
  }

  /* --- camera --- */
  const shakeAmp=S.shake*.016+shakeKick*.05;
  const n1=Math.sin(time*31.7)+Math.sin(time*17.3+2.1), n2=Math.sin(time*27.1+.7)+Math.sin(time*13.9+4.2);
  camera.position.z=S.dolly; camera.position.x=Math.sin(time*.12)*3*(1-S.warp);
  camera.rotation.set(
    n1*shakeAmp*.5 - my*.018*(1-S.warp*.85),
    n2*shakeAmp*.5 - mx*.024*(1-S.warp*.85),
    S.roll + n1*shakeAmp*.25
  );
  if(Math.abs(camera.fov-(S.fov+flashV*6))>.01){camera.fov=S.fov+flashV*6;camera.updateProjectionMatrix();}

  /* --- post + flash decay --- */
  bloom.strength=S.bloom+flashV*1.3+S.flare*.25;
  grade.uniforms.uCA.value=S.ca+shakeKick*.4;
  shakeKick*=Math.pow(.0008,dt); if(shakeKick<.001)shakeKick=0;
  flashV*=Math.pow(.00005,dt); if(flashV<.004)flashV=0;
  flashEl.style.opacity=flashV.toFixed(3);

  /* cruise whooshes */
  if(cruise){ whooshT-=dt; if(whooshT<=0){Audio2.whoosh();whooshT=rand(.25,.6);} }

  composer.render();

  /* auto-play once engine alive */
  if(!readyShown){ readyShown=true;
    $('#loadRow').style.display='none';
    gsap.to(fadeEl,{opacity:0,duration:1.6,ease:'power2.out'});
    setTimeout(()=>beginSequence(),600);
    try{ lucide.createIcons(); }catch(e){}
  }
  /* auto-enter website after title reveal */
  if(mode==='play'&&t>8&&!window._enterShown){
    window._enterShown=true;
    const inIframe = window.parent !== window;
    if(inIframe){
      try{ window.parent.postMessage({type:'intro-complete'},'*'); }catch(e){}
    } else {
      try{ localStorage.setItem('intro_shown','1'); }catch(e){}
      try{ if(document.fullscreenElement) document.exitFullscreen?.(); }catch(e){}
      window.location.href='/';
    }
  }
}
renderer.setAnimationLoop(loop);
try{ lucide.createIcons(); }catch(e){}
</script>
